services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: task_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_manager -d task_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      HTTP_ADDRESS: ":8080"
      DATABASE_URL: "postgres://task_manager:${POSTGRES_PASSWORD:-change_this_password}@postgres:5432/task_manager?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting}
      JWT_TTL: ${JWT_TTL:-30m}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - api
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  postgres_data:
